[package]
name = "c2_server"
version = "0.1.0"
edition = "2021"

[dependencies]
commun = { path = "../commun" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
obfstr = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
